<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minerva Foods · Price Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="chart.umd.min.js?v=20260727e"></script>
<style>
:root[data-theme="light"]{
  --bg:#f0eeee; --bg2:#ffffff; --bg3:#e8e4e4; --bg4:#ddd8d8;
  --border:rgba(0,0,0,.08); --border2:rgba(0,0,0,.14);
  --text:#1a1515; --text2:#5a5252; --text3:#9a8e8e;
  --accent:#8b1a1a; --accent-soft:rgba(139,26,26,.12); --accent-border:rgba(139,26,26,.30);
  --teal:#1f9e8f; --teal-soft:rgba(31,158,143,.12); --teal-border:rgba(31,158,143,.30);
  --amber:#c17c0a; --amber-soft:rgba(193,124,10,.12);
  --blue:#3a7fc1; --blue-soft:rgba(58,127,193,.12);
  --violet:#7c5fc4; --violet-soft:rgba(124,95,196,.12);
  --error:#c94343; --error-soft:rgba(201,67,67,.12);
  --shadow: 0 1px 2px rgba(20,10,10,.04), 0 10px 28px -8px rgba(20,10,10,.10);
  --shadow-hover: 0 1px 2px rgba(20,10,10,.05), 0 16px 36px -10px rgba(20,10,10,.16);
}
:root[data-theme="dark"]{
  --bg:#0d0c0c; --bg2:#161414; --bg3:#1e1b1b; --bg4:#262222;
  --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.13);
  --text:#f2eeee; --text2:#9c9494; --text3:#7a7272;
  --accent:#b3312f; --accent-soft:rgba(179,49,47,.16); --accent-border:rgba(179,49,47,.34);
  --teal:#34c2b0; --teal-soft:rgba(52,194,176,.14); --teal-border:rgba(52,194,176,.32);
  --amber:#e8a045; --amber-soft:rgba(232,160,69,.14);
  --blue:#5b9bd5; --blue-soft:rgba(91,155,213,.14);
  --violet:#9b7fd4; --violet-soft:rgba(155,127,212,.14);
  --error:#f87171; --error-soft:rgba(248,113,113,.14);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -8px rgba(0,0,0,.4);
  --shadow-hover: 0 1px 2px rgba(0,0,0,.35), 0 16px 36px -10px rgba(0,0,0,.5);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{font-family:'Outfit',sans-serif; background:var(--bg); color:var(--text); overflow:hidden;}
::selection{background:var(--accent); color:#fff;}

.app{display:flex; height:100vh;}

/* SIDEBAR */
.sidebar{width:230px; flex-shrink:0; background:var(--bg2); border-right:1px solid var(--border); display:flex; flex-direction:column;}
.brand{padding:18px 18px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px;}
.brand-avatar{width:38px; height:38px; border-radius:30%; flex-shrink:0; background:var(--bg3); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; overflow:hidden;}
.brand-avatar img{width:100%; height:100%; object-fit:cover; display:block;}
.brand-text{min-width:0;}
.brand-name{font-size:14px; font-weight:700; letter-spacing:.1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.brand-sub{font-size:10px; color:var(--text3); margin-top:2px; font-weight:600; text-transform:uppercase; letter-spacing:.6px;}

.nav{flex:1; padding:12px 10px; display:flex; flex-direction:column; gap:2px; overflow-y:auto;}
.nav-item{display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:9px; font-size:12.5px; font-weight:500; color:var(--text2); cursor:pointer; transition:all .16s;}
.nav-item svg{width:15px;height:15px; flex-shrink:0; opacity:.8;}
.nav-item:hover{background:var(--bg3); color:var(--text);}
.nav-item.active{background:var(--accent-soft); color:var(--accent); font-weight:700;}
.nav-item.active svg{opacity:1;}
.nav-num{font-size:9.5px; color:var(--text3); font-weight:700; width:13px;}
.nav-item.active .nav-num{color:var(--accent);}

.sidebar-foot{padding:12px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:8px;}
.live-indicator{display:flex; align-items:center; gap:7px; padding:6px 10px; font-size:11px; color:var(--text3); font-weight:500;}
.live-dot{width:6px;height:6px;border-radius:50%; background:var(--teal); box-shadow:0 0 0 3px var(--teal-soft); flex-shrink:0;}
.logout-btn{display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; font-size:12px; font-weight:500; color:var(--text2); cursor:pointer; transition:.16s; border:none; background:none; width:100%; text-align:left;}
.logout-btn:hover{background:var(--bg3); color:var(--text);}
.logout-btn svg{width:14px;height:14px; opacity:.75;}

/* MAIN */
.main{flex:1; display:flex; flex-direction:column; min-width:0;}
.topbar{height:60px; flex-shrink:0; background:var(--bg2); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 22px; gap:16px;}
.topbar-title{font-size:15px; font-weight:700;}
.topbar-title span{color:var(--text3); font-weight:500; font-size:10px; margin-left:2px; display:block; text-transform:uppercase; letter-spacing:.4px;}
.topbar-left{display:flex; flex-direction:column; justify-content:center;}
.topbar-right{display:flex; align-items:center; gap:10px;}

.date-range{display:flex; align-items:center; gap:6px; background:var(--bg3); border:1px solid var(--border); border-radius:10px; padding:5px 10px;}
.date-range input{border:none; background:none; color:var(--text2); font-family:'Outfit',sans-serif; font-size:11.5px; font-weight:500; width:98px; outline:none;}
.date-range svg{width:13px;height:13px; color:var(--text3); flex-shrink:0;}
.date-sep{color:var(--text3); font-size:11px;}

.btn-refresh{display:flex; align-items:center; gap:6px; padding:8px 14px; border-radius:10px; background:var(--teal-soft); color:var(--teal); border:1px solid var(--teal-border); font-family:'Outfit',sans-serif; font-size:12px; font-weight:600; cursor:pointer; transition:.16s;}
.btn-refresh:hover{filter:brightness(1.08);}
.btn-refresh svg{width:14px;height:14px; transition:transform .5s;}
.btn-refresh.spinning svg{animation:spin .6s linear;}
@keyframes spin{to{transform:rotate(360deg);}}

.btn-theme{width:34px;height:34px; border-radius:10px; background:var(--bg3); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text2); transition:.16s; flex-shrink:0;}
.btn-theme:hover{color:var(--text); border-color:var(--border2);}
.btn-theme svg{width:16px;height:16px;}

.content{flex:1; overflow-y:auto; padding:22px 26px 50px;}
.section{display:none; animation:fadeSlide .2s ease;}
.section.active{display:block;}
@keyframes fadeSlide{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.page-head{margin-bottom:20px;}
.page-head h1{font-size:20px; font-weight:800; letter-spacing:-.2px;}
.page-head p{font-size:12.5px; color:var(--text2); margin-top:4px; max-width:640px;}

/* KPI GRID */
.kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px;}
.kpi-card{position:relative; border:1px solid var(--border); border-radius:14px; padding:16px; box-shadow:var(--shadow); transition:transform .18s, box-shadow .18s; overflow:hidden;}
.kpi-card:hover{transform:translateY(-3px); box-shadow:var(--shadow-hover);}
.kpi-card.k-accent{background:linear-gradient(135deg, var(--accent-soft) 0%, var(--bg2) 62%); }
.kpi-card.k-teal{background:linear-gradient(135deg, var(--teal-soft) 0%, var(--bg2) 62%);}
.kpi-card.k-amber{background:linear-gradient(135deg, var(--amber-soft) 0%, var(--bg2) 62%);}
.kpi-card.k-blue{background:linear-gradient(135deg, var(--blue-soft) 0%, var(--bg2) 62%);}
.kpi-card.k-violet{background:linear-gradient(135deg, var(--violet-soft) 0%, var(--bg2) 62%);}
.kpi-top{display:flex; align-items:flex-start; justify-content:space-between;}
.kpi-label{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--text3); max-width:75%;}
.kpi-icon-chip{width:34px;height:34px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.kpi-icon-chip svg{width:16px;height:16px;}
.k-accent .kpi-icon-chip{background:var(--accent-soft); color:var(--accent);}
.k-teal .kpi-icon-chip{background:var(--teal-soft); color:var(--teal);}
.k-amber .kpi-icon-chip{background:var(--amber-soft); color:var(--amber);}
.k-blue .kpi-icon-chip{background:var(--blue-soft); color:var(--blue);}
.k-violet .kpi-icon-chip{background:var(--violet-soft); color:var(--violet);}
.kpi-value{font-size:23px; font-weight:800; margin-top:10px; letter-spacing:-.4px;}
.k-accent .kpi-value{color:var(--accent);}
.k-teal .kpi-value{color:var(--teal);}
.k-amber .kpi-value{color:var(--amber);}
.k-blue .kpi-value{color:var(--blue);}
.k-violet .kpi-value{color:var(--violet);}
.kpi-foot{font-size:11px; color:var(--text2); margin-top:6px; font-weight:500;}

/* KPI info tooltip (ⓘ) */
.kpi-info{position:absolute; bottom:14px; right:14px; width:15px;height:15px; border-radius:50%; border:1px solid var(--border2); color:var(--text3); font-size:9.5px; font-weight:700; display:flex; align-items:center; justify-content:center; cursor:help; background:var(--bg2);}
.kpi-info:hover{border-color:var(--accent); color:var(--accent);}
.kpi-tooltip{display:none; position:absolute; bottom:34px; right:0; width:240px; background:var(--text); color:var(--bg2); font-size:11px; font-weight:500; line-height:1.5; padding:10px 12px; border-radius:8px; z-index:20; box-shadow:0 8px 24px rgba(0,0,0,.25);}
.kpi-info:hover + .kpi-tooltip, .kpi-tooltip:hover{display:block;}

/* CARDS */
.grid-2{display:grid; grid-template-columns:1.4fr 1fr; gap:16px; margin-bottom:16px;}
.card{background:var(--bg2); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); margin-bottom:16px; padding:18px;}
.card-head{display:flex; align-items:center; justify-content:space-between; margin:-18px -18px 16px; padding:16px 18px; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:10px;}
.card-title{font-size:13px; font-weight:700;}
.card-sub{font-size:11px; color:var(--text3); margin-top:2px; font-weight:500;}
.chart-wrap{position:relative; width:100%;}

/* CHIPS */
.chips{display:flex; flex-wrap:wrap; gap:6px;}
.chip{padding:5px 12px; border-radius:20px; font-size:11px; font-weight:600; background:var(--bg3); color:var(--text2); border:1px solid var(--border); cursor:pointer; transition:.15s;}
.chip:hover{border-color:var(--accent);}
.chip.active{background:var(--accent); color:#fff; border-color:var(--accent);}

/* CRUCE DIRECTO (comparador de corte propio vs. corte de competencia) */
.cross-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;}
.combo-wrap{position:relative;}
.combo-label{display:flex; align-items:center; gap:7px; font-size:11px; font-weight:700; color:var(--text3); text-transform:uppercase; letter-spacing:.3px; margin-bottom:6px;}
.combo-input{width:100%; padding:9px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:13px; font-family:'Outfit',sans-serif;}
.combo-input:focus{outline:none; border-color:var(--accent);}
.combo-list{display:none; position:absolute; top:calc(100% + 4px); left:0; right:0; max-height:220px; overflow-y:auto; background:var(--bg2); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow-hover); z-index:30;}
.combo-list.open{display:block;}
.combo-item{padding:8px 12px; font-size:12.5px; cursor:pointer; color:var(--text);}
.combo-item:hover, .combo-item.hi{background:var(--bg3);}
.combo-item.selected{color:var(--accent); font-weight:700;}
.combo-empty{padding:8px 12px; font-size:12px; color:var(--text3); font-style:italic;}
.cross-result{display:grid; grid-template-columns:1fr auto 1fr; gap:16px; align-items:center; margin-top:6px;}
.cross-box{background:var(--bg3); border-radius:12px; padding:14px 16px; border-left:4px solid transparent;}
.cross-box-propio{border-left-color:var(--teal); background:color-mix(in srgb, var(--teal) 7%, var(--bg3));}
.cross-box-comp{border-left-color:var(--accent); background:color-mix(in srgb, var(--accent) 7%, var(--bg3));}
.cross-box .cross-corte{font-size:13px; font-weight:700; margin:6px 0 8px;}
.cross-box .cross-range{font-size:17px; font-weight:800;}
.cross-box .cross-n{font-size:11px; color:var(--text3); margin-top:2px;}
.cross-gap{text-align:center;}
.cross-gap .cross-gap-pct{font-size:22px; font-weight:800;}
.cross-gap .cross-gap-label{font-size:10.5px; color:var(--text3); text-transform:uppercase; letter-spacing:.3px; max-width:135px; margin:0 auto;}
@media (max-width:900px){ .cross-grid{grid-template-columns:1fr;} .cross-result{grid-template-columns:1fr;} }

/* TABLES */
table{width:100%; border-collapse:collapse; font-size:12.5px;}
th{text-align:left; padding:9px 12px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--text3); background:var(--bg3); border-bottom:1px solid var(--border); white-space:nowrap;}
td{padding:9px 12px; border-bottom:1px solid var(--border); color:var(--text);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--bg3);}
.table-scroll{max-height:420px; overflow-y:auto;}
.num{text-align:right; font-variant-numeric:tabular-nums;}
.tag{display:inline-flex; padding:3px 9px; border-radius:20px; font-size:10.5px; font-weight:700;}
.tag-propio{background:var(--teal-soft); color:var(--teal);}
.tag-comp{background:var(--accent-soft); color:var(--accent);}
.tag-alta{background:var(--accent-soft); color:var(--accent);}
.tag-media{background:var(--amber-soft); color:var(--amber);}
.tag-baja{background:var(--teal-soft); color:var(--teal);}

/* COVERAGE / SEMAPHORE */
.cov-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
.cov-card{background:var(--bg3); border:1px solid var(--border); border-radius:12px; padding:16px;}
.cov-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; gap:8px;}
.cov-cat{font-size:12.5px; font-weight:700;}
.cov-pct{font-size:20px; font-weight:800;}
.progress{height:8px; border-radius:20px; background:var(--bg4); overflow:hidden;}
.progress-bar{height:100%; border-radius:20px; transition:width .4s;}
.pb-green{background:var(--teal);} .pb-amber{background:var(--amber);} .pb-red{background:var(--accent);}
.cov-note{font-size:11px; color:var(--text3); margin-top:8px;}

.note-box{background:var(--amber-soft); border:1px solid var(--amber); border-radius:10px; padding:12px 14px; font-size:12px; color:var(--text); margin-top:14px; display:flex; gap:10px; align-items:flex-start;}
.note-box svg{flex-shrink:0; margin-top:1px; color:var(--amber);}
.note-box.top{margin-top:0;}

/* ALERTS */
.alert-panel{display:grid; grid-template-columns:repeat(auto-fit, minmax(210px,1fr)); gap:14px; margin-bottom:20px;}
.alert-card{border-radius:14px; padding:14px 16px; border:1px solid var(--border); background:var(--bg2); box-shadow:var(--shadow); cursor:pointer; transition:.16s;}
.alert-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-hover);}
.alert-top{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
.alert-dot{width:8px;height:8px;border-radius:50%; flex-shrink:0;}
.dot-alta{background:var(--accent);} .dot-media{background:var(--amber);} .dot-baja{background:var(--teal);}
.alert-label{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--text3);}
.alert-title{font-size:12.5px; font-weight:600; line-height:1.4;}
.alert-card.expanded{grid-column:1 / -1; cursor:default;}
.alert-detail{display:none; margin-top:12px; border-top:1px solid var(--border); padding-top:10px;}
.alert-detail.open{display:block;}
.alert-detail .table-scroll{max-height:320px;}
.alert-detail table{font-size:11.5px; min-width:340px;}
.alert-detail th, .alert-detail td{padding:6px 8px; background:none; white-space:nowrap;}
.alert-note{font-size:10.5px; color:var(--text3); font-style:italic; margin-top:6px;}

/* LOADING STATE */
.loading-state{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:80px 20px; text-align:center;}
.loading-spinner{width:36px; height:36px; border-radius:50%; border:3px solid var(--border2); border-top-color:var(--accent); animation:loadspin .8s linear infinite;}
@keyframes loadspin{to{transform:rotate(360deg);}}
.loading-text{font-size:13.5px; font-weight:600; color:var(--text2);}
.loading-bar{width:220px; height:6px; border-radius:20px; background:var(--bg4); overflow:hidden; position:relative;}
.loading-bar-fill{position:absolute; top:0; left:0; height:100%; width:40%; border-radius:20px; background:linear-gradient(90deg, var(--teal), var(--accent)); animation:loadbar 1.1s ease-in-out infinite;}
@keyframes loadbar{0%{left:-40%;} 100%{left:100%;}}

@media (max-width:1100px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .grid-2{grid-template-columns:1fr;}
}
</style>

</head>
<body>
<div class="app" id="appRoot">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-avatar"><img src="logominervarojo.png" alt="Minerva Foods"></div>
      <div class="brand-text">
        <div class="brand-name">Minerva Foods</div>
        <div class="brand-sub">Price Intelligence · +Marka</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-item active" data-section="resumen"><span class="nav-num">01</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Resumen</div>
      <div class="nav-item" data-section="precios"><span class="nav-num">02</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Precios</div>
      <div class="nav-item" data-section="pedidos"><span class="nav-num">03</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 2-1.6L22 7H6"/><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/></svg>Pedidos</div>
      <div class="nav-item" data-section="carniceria"><span class="nav-num">04</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9"/><path d="M9 21V13h6v8"/></svg>Carnicería</div>
      <div class="nav-item" data-section="competencia"><span class="nav-num">05</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/><circle cx="20" cy="6" r="2.5"/><circle cx="4" cy="6" r="2.5"/></svg>Competencia</div>
      <div class="nav-item" data-section="cobertura"><span class="nav-num">06</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 3 6v6c0 5 4 8.5 9 10 5-1.5 9-5 9-10V6z"/></svg>Cobertura</div>
      <div class="nav-item" data-section="recomendaciones"><span class="nav-num">07</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.6.55 1 1.35 1 2.2V16h6v-.3c0-.85.4-1.65 1-2.2A6 6 0 0 0 12 3Z"/></svg>Recomendaciones</div>
      <div class="nav-item" data-section="alertas"><span class="nav-num">08</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>Alertas</div>
    </nav>
    <div class="sidebar-foot">
      <div class="live-indicator"><div class="live-dot"></div>Datos en vivo</div>
      <button class="logout-btn" id="logoutBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>Cerrar sesión</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title" id="topTitle">Resumen<span>Minerva Foods · Price Intelligence</span></div>
      </div>
